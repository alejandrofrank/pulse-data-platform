name: pulse

x-app: &app
  image: pulse-app:local
  build:
    context: .
    dockerfile: backend/00_infrastructure/Dockerfile
    target: runtime
  environment: &environment
    DATABASE_URL: postgresql://pulse:pulse_local@db:5432/pulse
    DAGSTER_DB_URL: postgresql+psycopg2://pulse:pulse_local@db:5432/dagster
    PULSE_DATA_DIR: /data
  volumes:
    - ./data:/data:ro
  init: true

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse_local
      POSTGRES_DB: pulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/00_infrastructure/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pulse -d pulse"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  bootstrap:
    <<: *app
    command: [pulse, bootstrap]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *environment
      DATABASE_URL: postgresql://pulse_reader:pulse_reader_local@db:5432/pulse
      PULSE_AGENT_AUDIT_URL: postgresql://pulse_agent_writer:pulse_agent_writer_local@db:5432/pulse
      OPENAI_API_KEY_FILE: /run/pulse/openai-api-key
      PULSE_AGENT_DAILY_BUDGET_USD: ${PULSE_AGENT_DAILY_BUDGET_USD:-0.50}
      PULSE_USE_DECISIONS: ${PULSE_USE_DECISIONS:-true}
      PULSE_LAB_PORT: ${LAB_PORT:-8001}
      PULSE_TEST_REPORT_DIR: /reports
    volumes:
      - ./data:/data:ro
      - ./test-results/dashboard:/reports:ro
    tmpfs:
      - /run/pulse:rw,noexec,nosuid,size=64k,uid=10001,gid=10001,mode=0700
    ports:
      - "127.0.0.1:${PULSE_PORT:-8000}:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dagster:
    <<: *app
    command: [dagster-webserver, -h, 0.0.0.0, -p, "3000", -w, workspace.yaml]
    ports:
      - "127.0.0.1:${DAGSTER_PORT:-3000}:3000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info')"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  daemon:
    <<: *app
    command: [dagster-daemon, run, -w, workspace.yaml]
    depends_on:
      dagster:
        condition: service_healthy
    healthcheck:
      test: [CMD, dagster-daemon, liveness-check]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  test:
    <<: *app
    profiles: [test]
    image: pulse-test:local
    build:
      context: .
      dockerfile: backend/00_infrastructure/Dockerfile
      target: test
    environment:
      <<: *environment
      TEST_DATABASE_URL: postgresql://pulse:pulse_local@db:5432/pulse_test
    depends_on:
      db:
        condition: service_healthy

  lab-db:
    profiles: [lab]
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: lab_owner
      POSTGRES_PASSWORD: lab_owner_local
      POSTGRES_DB: pulse_lab
    volumes:
      - lab_postgres_data:/var/lib/postgresql/data
      - ./backend/00_infrastructure/postgres/init-lab.sql:/docker-entrypoint-initdb.d/init-lab.sql:ro
    networks: [lab]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lab_owner -d pulse_lab"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  lab:
    <<: *app
    profiles: [lab]
    command: [uvicorn, "pulse_api.lab_api:app", --host, 0.0.0.0, --port, "8001", --workers, "1"]
    environment:
      DATABASE_URL: postgresql://pulse_reader:pulse_reader_local@lab-db:5432/pulse_lab
      LAB_DATABASE_URL: postgresql://lab_owner:lab_owner_local@lab-db:5432/pulse_lab
      PULSE_DASHBOARD_PORT: ${PULSE_PORT:-8000}
      PULSE_DATA_DIR: /data
      PULSE_INTERNAL_API_PORT: '8001'
    ports:
      - "127.0.0.1:${LAB_PORT:-8001}:8001"
    networks: [lab]
    depends_on:
      lab-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/lab/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  lab_postgres_data:

networks:
  lab:

