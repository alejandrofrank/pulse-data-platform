name: Phase 1 verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build test image and start test database
        run: |
          docker compose build test
          docker compose up -d --wait db
      - name: Lint and formatting
        run: |
          docker compose run --rm test ruff check src tests scripts
          docker compose run --rm test ruff format --check src tests scripts
      - name: Unit and PostgreSQL integration tests
        run: docker compose run --rm test pytest -q -p no:cacheprovider
      - name: Build and start the actual application
        run: docker compose up -d --build --wait
      - name: Verify API, dashboard assets and repeatable ingestion
        run: |
          python scripts/smoke.py --save /tmp/pulse-before.json
          docker compose run --rm bootstrap pulse ingest
          python scripts/smoke.py --compare /tmp/pulse-before.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dashboard DOM integration checks against the live API
        run: |
          npm ci
          npm run lint
          npm test
      - name: Verify isolated CSV playback and reverse replay
        run: |
          docker compose --profile lab up -d --build --wait lab
          python scripts/lab_smoke.py --disposable
          python scripts/smoke.py --compare /tmp/pulse-before.json
      - name: Collect service logs
        if: always()
        run: docker compose --profile lab logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-logs
          path: compose.log
      - name: Stop disposable CI services
        if: always()
        run: docker compose --profile lab down -v

