name: Platform verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build test image and start test database
        run: |
          docker compose build test
          docker compose up -d --wait db
      - name: Lint and formatting
        run: |
          docker compose run --rm test ruff check 01_pipeline 02_api 04_agents tests 03_scripts
          docker compose run --rm test ruff format --check 01_pipeline 02_api 04_agents tests 03_scripts
      - name: Unit and PostgreSQL integration tests
        run: |
          mkdir -p test-results/dashboard
          chmod a+rwx test-results/dashboard
          date -u +%Y-%m-%dT%H:%M:%SZ > test-results/dashboard/backend.started
          set +e
          docker compose run --rm -v "$PWD/test-results/dashboard:/reports" test pytest -q -p no:cacheprovider --junitxml=/reports/backend.xml
          code=$?
          echo "$code" > test-results/dashboard/backend.exit
          date -u +%Y-%m-%dT%H:%M:%SZ > test-results/dashboard/backend.finished
          exit "$code"
      - name: Build and start the actual application
        run: docker compose up -d --build --wait
      - name: Verify API, dashboard assets and repeatable ingestion
        run: |
          python backend/03_scripts/smoke.py --save /tmp/pulse-before.json
          docker compose run --rm bootstrap pulse ingest
          python backend/03_scripts/smoke.py --compare /tmp/pulse-before.json
      - name: Verify both agents with real database evidence in explicit demo mode
        run: python backend/03_scripts/agent_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dashboard DOM integration checks against the live API
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          date -u +%Y-%m-%dT%H:%M:%SZ > test-results/dashboard/frontend.started
          set +e
          (cd frontend && node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=../test-results/dashboard/frontend.xml */tests/*.test.cjs)
          code=$?
          echo "$code" > test-results/dashboard/frontend.exit
          date -u +%Y-%m-%dT%H:%M:%SZ > test-results/dashboard/frontend.finished
          exit "$code"
      - name: Verify isolated CSV playback and reverse replay
        run: |
          docker compose --profile lab up -d --build --wait lab
          python backend/03_scripts/lab_smoke.py --disposable
          python backend/03_scripts/smoke.py --compare /tmp/pulse-before.json
      - name: Verify automatic pickup through the Dagster daemon
        run: python backend/03_scripts/sensor_smoke.py --data-dir data --disposable
      - name: Verify diagnostic startup with quarantined input
        run: python backend/03_scripts/bootstrap_smoke.py --disposable
      - name: Collect service logs
        if: always()
        run: docker compose --profile lab logs --no-color > compose.log
      - name: Collect test dashboard
        if: always()
        run: python backend/03_scripts/test_dashboard.py --collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-dashboard
          path: test-results/dashboard/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-logs
          path: compose.log
      - name: Stop disposable CI services
        if: always()
        run: docker compose --profile lab down -v

